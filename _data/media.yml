- date: 2025-10-23
  title: "Corrientes marinas: ¿se está acelerando el pulso de los océanos?"
  outlet: "The Conversation"
  url: "https://theconversation.com/corrientes-marinas-se-esta-acelerando-el-pulso-de-los-oceanos-265929?utm_medium=article_clipboard_share&utm_source=theconversation.com"
  image: "https://images.theconversation.com/files/697277/original/file-20251020-56-oq5rv8.jpg?ixlib=rb-4.1.1&rect=0%2C12%2C6840%2C2280&q=50&auto=format&w=1920&h=640&fit=crop&dpr=2"
  excerpt: "En un análisis de tres décadas de datos satelitales hemos mostrado que la energía de los remolinos –responsables de cerca del 90 % del movimiento del océano– está creciendo de forma global, con un pulso especialmente fuerte en regiones como la corriente del Golfo o de Kuroshio."
  language: "es"
  type: "Science Communication"

