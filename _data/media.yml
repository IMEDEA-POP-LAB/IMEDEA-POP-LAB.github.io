- date: 2026-02-17
  title: "Los océanos se vuelven más dinámicos: la Extensión de Kuroshio y la Corriente del Golfo concentran la mayor energía"
  outlet: "IMEDEA Noticias"
  url: "https://imedea.uib-csic.es/comunicacion-y-cultura-cientifica/noticias/?new_id=2274"
  image: "https://imedea.uib-csic.es/files/get/1808961a21620c4bf947e6b5d74f9dfc_m"
  excerpt: "Un estudio internacional liderado por Bàrbara Barceló-Llull, investigadora del Instituto Mediterráneo de Estudios Avanzados (IMEDEA, CSIC-UIB), publicado recientemente ha revelado que la energía de los remolinos y meandros oceánicos —estructuras dinámicas de entre 10 y 100 km conocidas como variabilidad mesoescalar— se está incrementando de manera significativa en las regiones más dinámicas del planeta. Estas estructuras, que concentran aproximadamente el 90% de la energía cinética total de los océanos, desempeñan un papel crucial en la redistribución de calor, carbono y nutrientes, influyendo directamente en la circulación global y en el clima."
  language: "es"
  type: "News"

